name: Run build test

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
      - 'feature/**'
      - 'fix/**'
      - 'codex/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Eslint check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Test Build
        run: npm run build
